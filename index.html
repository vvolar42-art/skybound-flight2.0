<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Simulador 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
    canvas { display: block; }
  </style>

  <!-- PWA & Configuración Móvil -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ffcc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- Detección de errores en pantalla para móvil -->
  <script>
    window.onerror = function(msg, url, line) {
      var div = document.createElement('div');
      div.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:rgba(255,0,0,0.9);color:white;padding:10px;z-index:99999;font-size:12px;word-break:break-all;';
      div.innerHTML = '<b>ERROR:</b> ' + msg + '<br><b>Línea:</b> ' + line;
      document.body.appendChild(div);
    };
  </script>

  <!-- Carga de Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<script>
  // Registro del Service Worker para PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  // Configuración del mundo 3D
  const CHUNK_SIZE = 1000;
  const CHUNK_RES = 32;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.0002);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 20000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Iluminación
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(500, 1500, 500);
  scene.add(dirLight);

  // Avión
  const planeGroup = new THREE.Group();
  const bodyGeo = new THREE.ConeGeometry(6, 30, 8);
  bodyGeo.rotateX(Math.PI / 2);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdd2222 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  planeGroup.add(body);

  const wingGeo = new THREE.BoxGeometry(40, 1, 8);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const wing = new THREE.Mesh(wingGeo, wingMat);
  planeGroup.add(wing);

  scene.add(planeGroup);

  // Posición inicial (A salvo sobre las montañas)
  planeGroup.position.set(0, 1500, 0);

  // Generación de terreno: Montañas altas, esplanadas y variedad
  function pseudoNoise(x, z) { 
    const baseLand = 100;
    const nLow = Math.sin(x * 0.0004) * Math.cos(z * 0.0004);
    const nMid = Math.sin(x * 0.001) * Math.sin(z * 0.001);
    const smoothLow = Math.max(0, nLow) * Math.max(0, nLow) * (3 - 2 * Math.max(0, nLow));
    
    let height = baseLand + (smoothLow * 1400) + (Math.max(0, nMid) * 400);
    const rarePeak = Math.pow(Math.max(0, nLow), 8);
    height += rarePeak * 7000;

    return height;
  }

  const chunks = {};

  function createChunk(cx, cz) {
    const group = new THREE.Group();
    const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_RES, CHUNK_RES);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;

    for (let i = 0; i < pos.count; i++) {
      const vx = pos.getX(i) + cx * CHUNK_SIZE;
      const vz = pos.getZ(i) + cz * CHUNK_SIZE;
      let h = Math.max(50, pseudoNoise(vx, vz));
      pos.setY(i, h);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, flatShading: true });
    const terrain = new THREE.Mesh(geo, mat);
    group.add(terrain);

    // Agua
    const waterGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x0066cc, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.position.y = 52;
    group.add(water);

    // Pistas de aterrizaje
    const seed = Math.abs(Math.sin(cx * 12.9898 + cz * 78.233));
    if (Math.floor(seed * 100) % 5 === 0) {
      const rwayGeo = new THREE.PlaneGeometry(60, 500);
      rwayGeo.rotateX(-Math.PI / 2);
      const runway = new THREE.Mesh(rwayGeo, new THREE.MeshStandardMaterial({ color: 0x222222 }));
      runway.position.set(0, 1, 0); 
      group.add(runway);
      
      const tower = new THREE.Mesh(new THREE.CylinderGeometry(4, 6, 50, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
      tower.position.set(45, 25, 0); 
      group.add(tower);
    }

    // Vegetación y Nieve
    for (let i = 0; i < 18; i++) {
      const tx = (Math.random() - 0.5) * CHUNK_SIZE;
      const tz = (Math.random() - 0.5) * CHUNK_SIZE;
      const ty = pseudoNoise(tx + cx * CHUNK_SIZE, tz + cz * CHUNK_SIZE);
      
      if (ty > 55) {
        if (ty < 800) {
          if (Math.random() > 0.3) {
            const tree = new THREE.Mesh(new THREE.ConeGeometry(5, 18, 5), new THREE.MeshStandardMaterial({ color: 0x184725 }));
            tree.position.set(tx, ty + 9, tz); 
            group.add(tree);
          } else {
            const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(6 + Math.random() * 8), new THREE.MeshStandardMaterial({ color: 0x777777, flatShading: true }));
            rock.position.set(tx, ty + 4, tz); 
            group.add(rock);
          }
        } else if (ty >= 1200) {
          const snow = new THREE.Mesh(new THREE.ConeGeometry(25, 20, 5), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
          snow.position.set(tx, ty + 10, tz); 
          group.add(snow);
        }
      }
    }

    // Nubes
    if (seed > 0.3) {
      const cloud = new THREE.Mesh(new THREE.DodecahedronGeometry(60 + Math.random() * 60), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, flatShading: true }));
      cloud.position.set((Math.random() - 0.5) * CHUNK_SIZE, 2500 + Math.random() * 1500, (Math.random() - 0.5) * CHUNK_SIZE);
      group.add(cloud);
    }

    group.position.set(cx * CHUNK_SIZE, 0, cz * CHUNK_SIZE);
    scene.add(group);
    return group;
  }

  function updateChunks() {
    const px = Math.floor(planeGroup.position.x / CHUNK_SIZE);
    const pz = Math.floor(planeGroup.position.z / CHUNK_SIZE);
    
    for (let x = -2; x <= 2; x++) {
      for (let z = -2; z <= 2; z++) {
        const key = `${px + x},${pz + z}`;
        if (!chunks[key]) {
          chunks[key] = createChunk(px + x, pz + z);
        }
      }
    }
  }

  // Bucle principal de animación
  let speed = 4;

  function animate() {
    requestAnimationFrame(animate);

    // Movimiento constante
    planeGroup.translateZ(-speed);

    // Cámara siguiendo al avión
    const relativeCameraOffset = new THREE.Vector3(0, 20, 60);
    const cameraOffset = relativeCameraOffset.applyMatrix4(planeGroup.matrixWorld);
    camera.position.x = cameraOffset.x;
    camera.position.y = cameraOffset.y;
    camera.position.z = cameraOffset.z;
    camera.lookAt(planeGroup.position);

    updateChunks();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
